services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: traininapp-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-TraininApp!SqlServer2026}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traininapp-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TraininApp;User Id=sa;Password=${MSSQL_SA_PASSWORD:-TraininApp!SqlServer2026};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Key: "${JWT_KEY:-REMOVIDO}"
      Jwt__Issuer: "TraininApp.API"
      Jwt__Audience: "TraininApp.Client"
      Jwt__ExpirationMinutes: "60"
    ports:
      - "8080:8080"

volumes:
  sqlserver-data:
